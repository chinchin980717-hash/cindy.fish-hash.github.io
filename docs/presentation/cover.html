<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F5F5F7; display: flex; font-family: 'Noto Sans TC', sans-serif; color: #1D1D1F; position: relative; }
    .motif { position: absolute; left: 40px; top: 210px; width: 8px; height: 24px; background: #FF6B35; border-radius: 4px; }
    .content-left { width: 384px; padding: 210px 40px 40px 60px; display: flex; flex-direction: column; }
    .title { font-size: 48px; font-weight: 700; line-height: 1.2; margin-bottom: 24px; color: #1D1D1F; }
    .subtitle { font-size: 20px; color: #6E6E73; line-height: 1.5; }
    .footer { margin-top: auto; font-size: 14px; color: #6E6E73; }
    .hero-right { width: 896px; height: 720px; overflow: hidden; }
    .hero-img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif"></div>
    <div class="content-left">
      <h1 class="title">封面入口<br>正式打開第一幕</h1>
      <p class="subtitle">改版結案報告：手機排版優化、Play 直接啟動流程與角色視覺統一。</p>
      <div class="footer">我是魚 ｜ 2026.11.14 更新成果</div>
    </div>
    <div class="hero-right">
      <img class="hero-img" src="/home/ubuntu/fish-repo/assets/cover-play.png" alt="遊戲封面">
    </div>
  </div>
</body>
</html>
